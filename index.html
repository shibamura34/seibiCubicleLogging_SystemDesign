    <script>const f = [...document.querySelectorAll('figure')]; let i = 0; function activate() { f.forEach((x, n) => x.classList.toggle('active', n === i)); } document.querySelector('#show').onclick = () => { document.body.classList.add('present'); activate(); }; document.addEventListener('keydown', e => { if (!document.body.classList.contains('present')) return; if (e.key === 'Escape') { document.body.classList.remove('present'); return; } if (e.key === 'ArrowRight' || e.key === ' ') { i = Math.min(f.length - 1, i + 1); e.preventDefault(); } if (e.key === 'ArrowLeft') { i = Math.max(0, i - 1); e.preventDefault(); } activate(); }); document.querySelectorAll('figure a').forEach(a => a.addEventListener('click', e => { if (document.body.classList.contains('present')) { e.preventDefault(); i = Math.min(f.length - 1, i + 1); activate(); } }));</script>
